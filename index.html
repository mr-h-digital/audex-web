<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AudEx</title>
    <meta name="description" content="Housekeeping audits that work offline." />
    <meta name="theme-color" content="#0b4d60" />
    <script>
      /* apply a saved Light/Dark choice before the first paint, so the page never flashes the wrong theme */
      try { var t = localStorage.getItem("audex.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" type="image/webp" href="/logo/audex-lockup-white.webp" />
    <!-- splash:start -->
    <link rel="apple-touch-startup-image" href="/splash/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1080x2340.png" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- splash:end -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AudEx" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Splash shown until React mounts: brand teal, white lockup, tagline and a sweeping amber line. */
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        isolation: isolate; background: #0b4d60; color: #fff; font-family: system-ui, sans-serif; transition: opacity .35s ease; }
      #boot::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
        background: url("/src/assets/workspace-dark-background.webp") center / cover no-repeat; opacity: .12; }
      #boot[data-state="exiting"] { opacity: 0; pointer-events: none; }
      #boot img { width: 200px; height: auto; animation: boot-fade .6s ease-out both; }
      #boot p { margin: 14px 0 0; font-size: 15px; font-weight: 500; letter-spacing: .04em; opacity: .9; animation: boot-fade .6s .15s ease-out both; }
      .boot__bar { width: 120px; height: 3px; margin-top: 18px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,.18); }
      .boot__bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #f29934; animation: boot-sweep 1.1s ease-in-out infinite; }
      @keyframes boot-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes boot-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot img, #boot p, .boot__bar i { animation: none; } #boot { transition: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" data-state="loading" role="status" aria-label="Loading AudEx">
      <picture><source srcset="/logo/audex-lockup-white.webp" type="image/webp" /><img src="/logo/audex-lockup-white.png" alt="AudEx" width="924" height="240" /></picture>
      <p>Audit with confidence</p>
      <div class="boot__bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
